apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: order-pubsub
  namespace: default
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: "redis-master.redis.svc.cluster.local:6379"

    - name: redisPassword
      value: ""

    # TODO 1: TTL de 120 segundos para todos los mensajes del componente
    - name: ttlInSeconds
      value: "120"

    # TODO 2: Consumer group distinto por namespace (multi-tenancy)
    - name: consumerID
      value: "{namespace}"